[theme]
base = "light"
primaryColor = "#2f6b4f"
backgroundColor = "#f7f5ee"
secondaryBackgroundColor = "#eceee4"
textColor = "#1f3328"
linkColor = "#2f6b4f"
borderColor = "#d9ddcf"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.7rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
headingFontWeights = 600

[theme.sidebar]
backgroundColor = "#eef0e6"
secondaryBackgroundColor = "#ffffff"
